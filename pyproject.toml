[project]
name = "torrent-search-mcp"
version = "4.0.0"
description = "Torrent Search MCP Server"
authors = [{ name = "philogicae" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "crawl4ai",
    "aiocache",
    "fastmcp>=3,<4",
    "fastapi",
    "pybase62",
    "minify-html"
]

[project.urls]
Repository = "https://github.com/philogicae/torrent-search-mcp"
Release = "https://github.com/philogicae/torrent-search-mcp/releases"
DeepWiki = "https://deepwiki.com/philogicae/torrent-search-mcp"

[project.scripts]
torrent-search-mcp = "torrent_search.__main__:main"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio", "pytest-cov", "pytest-xdist", "ty"]

[tool.hatch.build]
include = ["torrent_search"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
    # third-party SyntaxWarning: 'return' in a 'finally' block
    "ignore::SyntaxWarning:crawl4ai\\.content_scraping_strategy",
    # third-party deprecation from starlette.testclient
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
