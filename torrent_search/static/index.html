<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torrent Search</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>" />
    <script data-key="oat.min.js" data-src="https://unpkg.com/@knadh/oat/oat.min.js" defer></script>
    <link rel="stylesheet" data-key="oat.min.css" data-src="https://unpkg.com/@knadh/oat/oat.min.css" />
    <script data-key="qrcode.min.js" data-src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ------------------------------------------------------------------
         zkPass-derived design system ("encrypted terminal meets classified
         broadsheet"): near-black surfaces layered by tone, hairline borders,
         no shadows, one Signal Lime accent. Light mode inverts to a paper
         broadsheet with olive ink; lime survives as a highlighter fill.
         ------------------------------------------------------------------ */
      :root {
        --serif: "Source Serif 4", "PT Serif", Georgia, "Times New Roman", serif;
        --sans: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --up: #2ee56b;
        --down: #ff6169;
        /* Orbit spinner: pastel rings pop on the night sky. */
        --orbit-blue: #91daffa5;
        --orbit-green: #91ffbfa5;
        --orbit-red: #ffca91a5;
        --orbit-white: #ffffff;
        /* Deterministic hue chips/titles: saturation+lightness per theme so
           every source keeps its color and stays readable in both modes. */
        --src-fg-s: 70%;
        --src-fg-l: 72%;
        --src-bg-s: 45%;
        --src-bg-l: 17%;
        /* Spacing scale fallback: oat.css loads async, dialogs must never
           render with zero padding/margins before it lands. Same values. */
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
      }
      body[data-theme="dark"] {
        color-scheme: dark;
        --bg-deep: #0a0a0d;
        /* Parallax-stars sky: template hues (#1B2735/#090A0F), lifted. */
        --sky-hi: #243349;
        --sky-lo: #131722;
        --surface: #202a3a;
        --card: #263246;
        --raised: #2f3d55;
        --border: #3a4a63;
        --border-faint: #2a3850;
        --border-strong: #4d5f7d;
        --text-muted: #9a9a9a;
        --text-2: #a8a8a8;
        --text-3: #d6d6d6;
        --text: #f2f2f2;
        --heading: #ffffff;
        --accent: #c5ff4a;
        --accent-dim: rgba(197, 255, 74, 0.1);
        --accent-line: #597321;
        --input-bg: #1d2635;
      }
      body[data-theme="light"] {
        color-scheme: light;
        --bg-deep: #d6d6c8;
        --sky-hi: #ececdf;
        --sky-lo: #c9c9b8;
        --surface: #fbfbf7;
        --card: #ffffff;
        --raised: #efefe6;
        --border: #d7d7cb;
        --border-faint: #e5e5db;
        --border-strong: #bcbcb0;
        --text-muted: #5f6254;
        --text-2: #45483f;
        --text-3: #262922;
        --text: #111310;
        --heading: #101208;
        --accent: #55731d;
        --accent-dim: rgba(85, 115, 29, 0.1);
        --accent-line: #c5ff4a;
        --input-bg: #ffffff;
        --src-fg-s: 55%;
        --src-fg-l: 30%;
        --src-bg-s: 40%;
        --src-bg-l: 87%;
        /* Orbit spinner on paper: saturated ink rings stay visible. */
        --orbit-blue: #1c6fbd;
        --orbit-green: #148a52;
        --orbit-red: #d9480f;
        --orbit-white: #33362e;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        height: 100dvh;
        overflow: hidden; /* the results area is the only scroller */
      }
      body {
        font-family: var(--sans);
        font-size: 14px;
        /* Radial night sky (single gradient, no animation). */
        background: radial-gradient(ellipse at bottom, var(--sky-hi) 0%, var(--sky-lo) 100%);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      button,
      input {
        font-family: inherit;
      }
      /* Thin, mobile-like scrollbars everywhere (incl. WebKit) */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 3px;
      }
      /* ------------------------------------------------------------------
         Pairing gate: fullscreen black scene, shown
         whenever the browser has no valid token.
         ------------------------------------------------------------------ */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: #0d0d0d; /* 95% black */
      }
      #gate[hidden] {
        display: none;
      }
      body:has(#gate:not([hidden])) #masthead,
      body:has(#gate:not([hidden])) #page-footer {
        display: none;
      }
      /* ------------------------------------------------------------------
         App shell
         ------------------------------------------------------------------ */
      #app {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      #app[hidden] {
        display: none;
      }
      /* Header: deep bar + single neon divider between major regions */
      #masthead {
        position: relative;
        z-index: 600; /* above the pairing shield: visible + usable pre-auth */
        background: var(--bg-deep);
        border-bottom: 4px solid var(--accent-line);
      }
      #masthead-inner {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 1rem;
        max-width: 90rem;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        margin: 0;
        font-family: var(--serif);
        font-weight: 300;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
        color: var(--heading);
        white-space: nowrap;
        overflow: hidden;
      }
      h1 .wave {
        font-size: 1.1rem;
        transform: translateY(-0.2rem);
      }
      h1 .word-accent {
        font-style: italic;
        color: var(--accent);
      }
      .head-actions {
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .icon-btn {
        width: 1.9rem;
        height: 1.9rem;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
      }
      .icon-btn:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }
      /* Theme flip: one sky-blue chip in both themes (reads as night or day
         depending on the mode; never cyan). */
      #theme-toggle {
        background: #0e33ab;
        border-color: #011040;
        color: #f0f7ff;
      }
      #auth-lock.authed {
        background: #33a158;
        border-color: #063817;
        color: #06210f;
      }
      #auth-lock.locked {
        background: #872b30;
        border-color: #54080c;
        color: #2b0608;
      }
      main.container {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 90rem;
        margin: 0 auto;
        padding: 0.7rem 1rem 0.5rem;
        box-sizing: border-box;
      }
      /* Toolbar */
      #toolbar {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) auto auto;
        gap: 0.5rem;
        align-items: stretch;
        margin-bottom: 0.6rem;
      }
      #toolbar label[data-field] {
        margin: 0;
        padding: 0;
        display: flex;
        line-height: 0;
      }
      #toolbar label[data-field] input {
        flex: 1;
        margin: 0; /* inputs carry a UA margin; it un-aligns the row */
      }
      #query {
        width: 100%;
        height: 2.2rem;
        box-sizing: border-box;
        background: color-mix(in srgb, var(--input-bg) 40%, transparent);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        padding: 0 0.6rem;
        font-size: 0.85rem;
      }
      #query:focus {
        outline: none;
        border-color: var(--accent);
      }
      #query::placeholder {
        color: var(--text-muted);
      }
      #toolbar button {
        height: 2.2rem;
        padding: 0 0.9rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--card) 40%, transparent);
        color: var(--text-3);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        white-space: nowrap;
        /* Flex centering keeps label glyphs (emoji included) on the same
           vertical axis as the input text. */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35em;
      }
      #toolbar button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--heading);
      }
      #toolbar button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      /* Results card */
      #results-card {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        /* Glass over the starfield, matching the popular tiles. */
        background: color-mix(in srgb, var(--card) 62%, transparent);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
      }
      /* Table (search view) */
      .results-scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .results-scroll[hidden] {
        display: none;
      }
      #results {
        width: 100%;
        min-width: 36rem;
        table-layout: fixed;
        border-collapse: collapse;
      }
      #results th,
      #results td {
        text-align: left;
        padding: 0.28rem 0.6rem;
        line-height: 1.3;
        white-space: nowrap;
      }
      #results thead th {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        border-bottom: 1px solid var(--border);
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      #results thead th[data-sort] {
        cursor: pointer;
        user-select: none;
      }
      #results thead th[data-sort]:hover {
        color: var(--accent);
      }
      #results thead th.sort-asc::after {
        content: " ▲";
        font-size: 0.55rem;
      }
      #results thead th.sort-desc::after {
        content: " ▼";
        font-size: 0.55rem;
      }
      #results tbody tr {
        border-bottom: 1px solid var(--border-faint);
      }
      #results tbody tr:hover {
        background: var(--raised);
      }
      #results td {
        font-size: 0.78rem;
        color: var(--text-3);
      }
      col.c-date {
        width: 5.75rem;
      }
      col.c-size {
        width: 5.5rem;
      }
      col.c-num {
        width: 3.9rem;
      }
      col.c-actions {
        width: 7.4rem;
      }
      td.num,
      th.c-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-family: var(--mono);
        font-size: 0.72rem;
      }
      td.date-cell {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--text-2);
      }
      /* Seed/leech colors must out-rank `#results td` (id specificity). */
      #results td.se {
        color: var(--up);
      }
      #results td.le {
        color: var(--down);
      }
      td.name-cell {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        overflow: hidden;
      }
      td.name-cell .filename-details {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.05rem;
        overflow: hidden;
      }
      td.name-cell .filename {
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
        color: var(--text);
      }
      td.name-cell .torrent-detail {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        min-width: 0;
        font-size: 0.62rem;
        line-height: 1.1;
      }
      .chip {
        display: inline-block;
        max-width: 11rem;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 2px;
        padding: 0 0.26rem;
        font-family: var(--mono);
        font-size: 0.48rem; /* greatly reduced so chips always fit one row */
        letter-spacing: 0.02em;
        line-height: 1.45;
        text-decoration: none; /* source chips are links */
      }
      a.chip:hover {
        text-decoration: underline;
      }
      .tile-source-link {
        color: inherit;
        text-decoration: none;
      }
      .tile-source-link:hover {
        text-decoration: underline;
      }
      .info-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0 0.15rem 0 0;
        opacity: 0.5;
        font-size: 0.75rem;
        color: var(--text-2);
      }
      .info-btn:hover,
      .info-btn.tooltip-open {
        opacity: 1;
        color: var(--accent);
      }
      td.actions-cell {
        text-align: right;
      }
      #results th:last-child {
        text-align: right;
      }
      td.actions-cell a,
      td.actions-cell button,
      td.actions-cell > span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.6rem;
        height: 1.6rem;
        padding: 0;
        text-decoration: none;
        vertical-align: middle;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
      }
      td.actions-cell img {
        width: 0.95rem;
        height: 0.95rem;
      }
      td.actions-cell a:hover,
      td.actions-cell button:hover:not(:disabled) {
        filter: drop-shadow(0 0 0.3rem var(--accent-dim));
      }
      td.actions-cell button:disabled,
      td.actions-cell > span {
        opacity: 0.3;
        cursor: not-allowed;
      }
      /* Popular tiles: fixed 3-column grid, uniform heights, glassy cards. */
      #tiles {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.6rem;
        align-content: start;
        padding: 0.6rem;
      }
      /* author display values would otherwise beat the hidden attribute */
      #tiles[hidden],
      .results-scroll[hidden] {
        display: none;
      }
      .tile {
        display: flex;
        flex-direction: column;
        height: 16rem;
        /* semi-transparent card over the page background */
        background: color-mix(in srgb, var(--card) 62%, transparent);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
      }
      /* Top tile always spans the full row; its list flows into the same
         3 columns, scrolling as one. Same height as every other tile. */
      .tile-top {
        grid-column: 1 / -1;
      }
      .tile-top .tile-body {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-content: start;
      }
      .tile-top .tile-row {
        border-right: 1px solid var(--border-faint);
      }
      .tile-head {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid var(--border-faint);
        background: color-mix(in srgb, var(--surface) 55%, transparent);
      }
      .tile-chevron {
        display: none;
      }
      .tile-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .tile-count {
        font-family: var(--mono);
        font-size: 0.62rem;
        color: var(--text-muted);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 0 0.35rem;
      }
      .tile-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        /* No overscroll-behavior: contain — when a list ends, the wheel
           must chain into the outer grid scroller instead of dying. */
      }
      .tile-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
        padding: 0.28rem 0.55rem;
        border-bottom: 1px solid var(--border-faint);
      }
      .tile-row:last-child {
        border-bottom: none;
      }
      .tile-row:hover {
        background: var(--raised);
      }
      .tile-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.05rem;
      }
      .tile-name-row {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        min-width: 0;
      }
      .tile-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.74rem;
        font-weight: 500;
        color: var(--text);
      }
      .tile-meta {
        display: flex;
        gap: 0.5rem;
        font-family: var(--mono);
        font-size: 0.62rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .tile-meta span {
        flex-shrink: 0;
      }
      /* Date is the least important fact: on narrow tiles it shrinks with
         an ellipsis instead of hard-clipping mid-glyph. */
      .tile-meta span:last-child {
        flex-shrink: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile-meta .m-se {
        color: var(--up);
      }
      .tile-meta .m-le {
        color: var(--down);
      }
      .tile-actions {
        display: flex;
        gap: 0.1rem;
        opacity: 0.75;
      }
      .tile-actions a,
      .tile-actions button {
        width: 1.5rem;
        height: 1.5rem;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
        text-decoration: none;
      }
      .tile-actions img {
        width: 0.9rem;
        height: 0.9rem;
      }
      .tile-actions button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      /* Loading spinner + empty state (no filler rows) */
      #loading {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }
      #loading[hidden] {
        display: none;
      }
      .loading-label {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .spinner-box {
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .leo {
        position: absolute;
        border-radius: 50%;
        box-sizing: border-box;
        will-change: transform;
      }
      .blue-orbit {
        width: 165px;
        height: 165px;
        border: 1px solid var(--orbit-blue);
      }
      .green-orbit {
        width: 120px;
        height: 120px;
        border: 1px solid var(--orbit-green);
      }
      .red-orbit {
        width: 90px;
        height: 90px;
        border: 1px solid var(--orbit-red);
      }
      .white-orbit {
        width: 60px;
        height: 60px;
        border: 2px solid var(--orbit-white);
      }
      #empty-state {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        color: var(--text-muted);
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #empty-state[hidden] {
        display: none;
      }
      #empty-state .empty-glyph {
        font-size: 1.6rem;
        opacity: 0.6;
      }
      /* Footer */
      #page-footer {
        position: relative;
        z-index: 600; /* above the pairing shield: visible + usable pre-auth */
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.15rem 1rem; /* slim bar: ~2px of breathing room */
        font-size: 0.6rem;
        line-height: 1.2;
        color: var(--text-muted);
        border-top: 1px solid var(--border-faint);
        background: var(--bg-deep);
      }
      .foot-left {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .foot-left svg {
        width: 0.7rem;
        height: 0.7rem;
      }
      #page-footer a {
        color: var(--text-muted);
        display: inline-flex;
      }
      #page-footer a svg {
        width: 0.7rem;
        height: 0.7rem;
      }
      #page-footer a:hover {
        color: var(--accent);
      }
      /* Filename tooltip */
      #filename-tooltip {
        position: fixed;
        z-index: 600;
        width: fit-content;
        max-width: min(40rem, calc(100vw - 2rem));
        max-height: calc(100vh - 2rem);
        max-height: calc(100dvh - 2rem);
        padding: var(--space-2) var(--space-3);
        background: var(--raised);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        font-size: 0.72rem;
        text-align: left;
        white-space: normal;
        overflow: auto;
        overflow-wrap: anywhere;
        word-break: break-word;
        pointer-events: none;
      }
      /* Dialogs (send + auth pairing) */
      dialog {
        --dlg-pad: var(--space-4);
        width: min(18rem, calc(100vw - 2rem)); /* one size for every dialog */
        max-height: calc(100dvh - 2rem); /* short/landscape screens: scroll, never clip */
        padding: 0;
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        overscroll-behavior: contain;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(2px);
      }
      dialog .dlg-body {
        position: relative;
        max-height: inherit;
        overflow: auto;
        padding: var(--dlg-pad);
      }
      /* Dismiss (download popup only; the pairing gate is intentionally
         undismissable). */
      dialog .dlg-close {
        position: absolute;
        top: 0.55rem;
        right: 0.55rem;
        width: 1.6rem;
        height: 1.6rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--text-2);
        font-size: 0.8rem;
        line-height: 1;
        cursor: pointer;
      }
      dialog .dlg-close:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }
      dialog h2 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        /* Full-bleed header band: hairline divider spans the whole modal,
           edge to edge, with real padding below it before the content. */
        margin: calc(-1 * var(--dlg-pad)) calc(-1 * var(--dlg-pad)) var(--space-3);
        padding: calc(var(--dlg-pad) - 0.1rem) var(--dlg-pad) var(--space-2);
        border-bottom: 1px solid var(--border);
        font-family: var(--serif);
        font-weight: 300;
        font-size: 0.95rem;
        white-space: nowrap;
        color: var(--heading);
      }
      dialog h2 .tg-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 4px;
        background: var(--accent-dim);
        border: 1px solid var(--accent-line);
      }
      dialog h2 .tg-badge img {
        width: 0.9rem;
        height: 0.9rem;
      }
      dialog .dlg-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2);
      }
      /* Single-row variant used by the pairing + forward dialogs: stretched
         to the same width as the QR panel above it. */
      dialog .dlg-actions.row {
        flex-wrap: nowrap;
        justify-content: center;
        gap: 0.25rem;
      }
      dialog .dlg-actions.row button {
        flex: 1 1 0; /* equal widths: every modal button the same size */
        min-width: 0;
        white-space: nowrap;
        font-size: 0.5rem;
        letter-spacing: 0.01em;
        padding-inline: 0.3rem;
        height: 1.9rem; /* same height as the base .dlg-actions button */
      }
      dialog .dlg-actions button {
        height: 1.9rem;
        min-height: 1.9rem;
        padding-inline: 0.7rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--raised);
        color: var(--text-3);
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      dialog .dlg-actions button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--heading);
      }
      /* Shared centered status line under the pairing/forward actions. */
      .pair-status {
        margin: var(--space-3) 0 0;
        text-align: center;
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        color: var(--text-2);
        min-height: 1rem;
      }
      #auth-status.waiting,
      #tg-status.waiting {
        color: #ffb454;
        animation: authPulse 1.2s ease-in-out infinite;
      }
      @keyframes authPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      #auth-status.ok,
      #tg-status.ok {
        color: var(--up);
      }
      #auth-status.bad,
      #tg-status.bad {
        color: var(--down);
      }
      /* QR panel: white backing (dark modules + quiet zone need contrast),
         stretched to a 0.4rem breathing gap from the modal borders. */
      .qr-box {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 0 var(--space-3);
        background: #ffffff;
        border-radius: 6px;
        padding: 0.4rem; /* doubles as the QR quiet zone */
      }
      .qr-box svg {
        width: 100%; /* spans the same width as the actions row below */
        height: auto;
        aspect-ratio: 1;
        display: block;
      }
      .or-sep {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 var(--space-3);
        color: var(--text-muted);
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.25em;
      }
      .or-sep::before,
      .or-sep::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-faint);
      }
      /* Agent relay mode: torrent card inside the forward dialog */
      #tg-agent[hidden] {
        display: none;
      }
      .agent-lead {
        margin: 0 0 var(--space-3);
        font-size: 0.8rem;
        color: var(--text-3);
      }
      .agent-card {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        padding: var(--space-3);
        background: color-mix(in srgb, var(--raised) 60%, transparent);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .agent-card dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.2rem 0.7rem;
        align-items: center;
        margin: 0;
      }
      .agent-card dt {
        font-family: var(--mono);
        font-size: 0.56rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .agent-card dd {
        margin: 0;
        font-size: 0.76rem;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .agent-card dd.wrap {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .agent-card dd.se {
        color: var(--up);
      }
      .agent-card dd.le {
        color: var(--down);
      }
      #tg-agent .dlg-actions {
        margin-top: var(--space-3);
      }
      @media (max-width: 1024px) {
        #tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .tile-top .tile-body {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        body {
          font-size: 13px;
        }
        #masthead-inner,
        main.container {
          padding-left: 0.6rem;
          padding-right: 0.6rem;
        }
        h1 {
          font-size: 1.05rem;
        }
        #toolbar {
          grid-template-columns: 1fr 1fr;
          gap: 0.4rem;
        }
        #toolbar label[data-field]:first-child {
          grid-column: 1 / -1;
        }
        /* Mobile search view: same card rows as the popular tiles. */
        #tiles.tile-cards {
          display: flex;
          flex-direction: column;
          padding: 0.45rem;
        }
        dialog {
          --dlg-pad: var(--space-3);
        }
        #tiles {
          display: flex;
          flex-direction: column;
          grid-template-columns: 1fr;
          padding: 0.45rem;
        }
        /* Accordion tiles: whole title bar toggles, one open at a time. */
        .tile {
          height: auto; /* desktop pins 16rem; collapsed must hug the head */
          max-height: none;
          flex-shrink: 0; /* keep every section head visible as a switcher */
        }
        /* The open section absorbs every free pixel left by the other
           sections (which keep their order); its list scrolls inside. */
        .tile.open {
          flex: 1 1 0%;
          min-height: 0;
        }
        .tile .tile-body {
          display: none;
        }
        .tile.open .tile-body {
          display: block;
        }
        .tile-top.open .tile-body {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
        }
        .tile-chevron {
          display: inline-flex;
          margin-left: auto;
          color: var(--text-muted);
          font-size: 0.7rem;
          transition: transform 0.15s ease;
        }
        .tile.open .tile-chevron {
          transform: rotate(180deg);
        }
        .tile-head {
          cursor: pointer;
        }
      }
    </style>
  </head>

    <script src="https://unpkg.com/@knadh/indexed-cache@0.4.4/dist/indexed-cache.min.js"></script>
    <script>
      // The oat UI library loads through indexed-cache (async blob swap), so
      // `ot` can be undefined when the app boots on a cold cache. Queue toasts
      // fired before it lands; flush once it defines itself.
      const otQueue = [];
      function toast(title, body, opts) {
        if (window.ot && window.ot.toast) window.ot.toast(title, body, opts);
        else otQueue.push([title, body, opts]);
      }
      Object.defineProperty(window, "ot", {
        get: () => otValue,
        set: (v) => {
          otValue = v;
          if (v && v.toast) {
            while (otQueue.length) v.toast(...otQueue.shift());
          }
        },
        configurable: true,
      });
      let otValue;

      // ---- Theme (house default: dark, persisted choice wins) -----------------
      const ic = new IndexedCache();
      ic.init()
        .then(() => ic.load())
        .catch(() => {});
      const themeBtn = document.getElementById("theme-toggle");
      function setTheme(theme) {
        document.body.dataset.theme = theme;
        try {
          localStorage.setItem("theme", theme);
        } catch {}
        themeBtn.textContent = theme === "dark" ? "🔆" : "🌙";
      }
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("theme");
      } catch {}
      if (savedTheme === "light" || savedTheme === "dark") setTheme(savedTheme);
      themeBtn.onclick = () => setTheme(document.body.dataset.theme === "dark" ? "light" : "dark");

      // ---- State --------------------------------------------------------------
      let rows = [];
      // Popular sections ordered by traffic (TorrentFreak 2026 ranking),
      // using the public display domains (the API aliases its scraping
      // mirrors: apibay.org -> thepiratebay.org, yts.mx -> yts.vg).
      const SOURCE_ORDER = ["thepiratebay.org", "1337x.to", "uindex.org", "eztvx.to", "yts.vg", "nyaa.si", "fitgirl-repacks.site", "subsplease.org", "bittorrented.com"];
      const SESSION_KEY = "telegram_session_token";
      let viewMode = "sections"; // "search" = table, "sections" = popular tiles
      const session = {
        enabled: false,
        authenticated: false,
        handle: null,
        prune: false,
        agent_name: null,
      };

      const $ = (id) => document.getElementById(id);

      function getToken() {
        try {
          return localStorage.getItem(SESSION_KEY) || "";
        } catch {
          return "";
        }
      }
      function setToken(token) {
        try {
          if (token) localStorage.setItem(SESSION_KEY, token);
          else localStorage.removeItem(SESSION_KEY);
        } catch {}
      }
      function authHeaders() {
        const token = getToken();
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      function sourceRank(s) {
        const i = SOURCE_ORDER.indexOf(s);
        return i === -1 ? SOURCE_ORDER.length : i;
      }

      // Deterministic hue per label so every source/category keeps its color.
      function hueFor(s) {
        let h = 0;
        for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) % 360;
        return h;
      }

      // Source labels are domains: link out to the site everywhere.
      function sourceLinkHtml(source, style, classAttr) {
        const href = `https://${escapeHtml(source)}/`;
        return `<a ${classAttr} href="${href}" target="_blank" rel="noopener noreferrer" title="Open ${escapeHtml(source)}"${style}>${escapeHtml(source)}</a>`;
      }
      function escapeHtml(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // ---- View switching (spinner / empty / table / tiles) -------------------
      function showLoading() {
        $("loading").hidden = false;
        $("empty-state").hidden = true;
        $("table-wrap").hidden = true;
        $("tiles").hidden = true;
      }
      function showEmpty(message) {
        $("loading").hidden = true;
        $("empty-state").hidden = false;
        $("empty-text").textContent = message || "No torrents found";
        $("table-wrap").hidden = true;
        $("tiles").hidden = true;
      }
      function showResults() {
        const mobile = mobileQuery.matches;
        $("loading").hidden = true;
        $("empty-state").hidden = true;
        // Mobile search renders cards in #tiles; the table can't fit a phone.
        $("table-wrap").hidden = viewMode !== "search" || mobile;
        $("tiles").hidden = viewMode === "search" && !mobile;
      }

      // ---- Table row (search view) --------------------------------------------
      function tgButtons(r) {
        if (!session.authenticated || !session.handle || !r.magnet_link) {
          return `<span title="Telegram unavailable" aria-label="Telegram unavailable">🚫</span>`;
        }
        const attrs = [
          `data-magnet="${escapeHtml(r.magnet_link)}"`,
          `data-filename="${escapeHtml(r.filename)}"`,
          `data-size="${escapeHtml(r.size)}"`,
          `data-date="${escapeHtml(r.date)}"`,
          `data-source="${escapeHtml(r.source)}"`,
          `data-category="${escapeHtml(r.category)}"`,
          `data-seeders="${escapeHtml(r.seeders)}"`,
          `data-leechers="${escapeHtml(r.leechers)}"`,
        ].join(" ");
        return `<a href="#" data-tg ${attrs} title="Forward to Telegram" aria-label="Forward to Telegram"><img src="/static/telegram.svg" alt="" /></a>`;
      }

      function infoButtonHtml(r) {
        return `<button class="info-btn" data-info data-filename="${escapeHtml(r.filename)}" aria-label="Show full filename" aria-expanded="false">ⓘ</button>`;
      }

      // Deterministic-hue chips, identical to the result list rendering.
      function sourceChipHtml(r) {
        if (!r.source) return "";
        const hue = hueFor(r.source);
        return sourceLinkHtml(r.source, ` style="color: hsl(${hue} var(--src-fg-s) var(--src-fg-l)); background: hsl(${hue} var(--src-bg-s) var(--src-bg-l))"`, 'class="chip"');
      }
      function categoryChipHtml(r) {
        if (!r.category) return "";
        const hue = hueFor(r.category);
        return `<span class="chip" style="color: hsl(${hue} calc(var(--src-fg-s) - 10%) var(--src-fg-l)); background: hsl(${hue} calc(var(--src-bg-s) - 5%) var(--src-bg-l))">${escapeHtml(r.category)}</span>`;
      }

      function rowHtml(r) {
        const magnet = r.magnet_link || "";
        const magnetBtn = magnet
          ? `<a href="${escapeHtml(magnet)}" title="Open magnet link" aria-label="Open magnet link">🧲</a>`
          : `<span title="No magnet link available" aria-label="No magnet link available">🚫</span>`;
        const copy = magnet
          ? `<button data-copy="${escapeHtml(magnet)}" title="Copy magnet link" aria-label="Copy magnet link">📋</button>`
          : `<button title="No magnet link available" aria-label="No magnet link available" disabled>📋</button>`;
        const tg = tgButtons(r);
        const info = infoButtonHtml(r);
        const chips = sourceChipHtml(r) + categoryChipHtml(r);
        const detail = chips ? `<span class="torrent-detail">${chips}</span>` : "";
        return `<tr>
              <td class="name-cell">${info}<span class="filename-details"><span class="filename">${escapeHtml(r.filename)}</span>${detail}</span></td>
              <td class="date-cell">${escapeHtml(r.date)}</td>
              <td class="num">${escapeHtml(r.size)}</td>
              <td class="num se">${r.seeders}</td>
              <td class="num le">${r.leechers}</td>
              <td class="actions-cell">${tg}${magnetBtn}${copy}</td>
            </tr>`;
      }

      // ---- Column sorting (search table) --------------------------------------
      let sortState = null; // { key, dir: 1 asc | -1 desc }
      function parseSize(s) {
        const m = String(s || "").match(/([\d.]+)\s*([KMGT]?)i?B/i);
        if (!m) return -1;
        const units = {
          "": 1,
          K: 1024,
          M: 1024 ** 2,
          G: 1024 ** 3,
          T: 1024 ** 4,
        };
        return parseFloat(m[1]) * units[m[2].toUpperCase()];
      }
      function sortValue(r, key) {
        if (key === "size") return parseSize(r.size);
        if (key === "se") return r.seeders ?? 0;
        if (key === "le") return r.leechers ?? 0;
        if (key === "date") return r.date || "";
        return (r.filename || "").toLowerCase();
      }
      function sortedRows() {
        if (!sortState) return rows;
        const { key, dir } = sortState;
        return [...rows].sort((a, b) => {
          const va = sortValue(a, key);
          const vb = sortValue(b, key);
          return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
        });
      }
      function paintSortIndicators() {
        document.querySelectorAll("#results thead th[data-sort]").forEach((th) => {
          th.classList.toggle("sort-asc", !!sortState && sortState.key === th.dataset.sort && sortState.dir === 1);
          th.classList.toggle("sort-desc", !!sortState && sortState.key === th.dataset.sort && sortState.dir === -1);
        });
      }
      function renderTable() {
        $("rows").innerHTML = sortedRows().map(rowHtml).join("");
        paintSortIndicators();
      }
      document.querySelector("#results thead").addEventListener("click", (e) => {
        const th = e.target.closest("th[data-sort]");
        if (!th) return;
        const key = th.dataset.sort;
        // First click: text columns ascend, metrics descend (most seeds / biggest first).
        const nextDir = sortState && sortState.key === key ? -sortState.dir : key === "name" ? 1 : -1;
        sortState = { key, dir: nextDir };
        renderTable();
      });

      // ---- Popular tiles -------------------------------------------------------
      function buildSections() {
        const bySeeders = (a, b) => b.seeders - a.seeders;
        // Top section lists every result; per-source sections repeat their
        // own full share, both sorted by seeders descending.
        const sections = [{ label: "🏆 Top Torrents", rows: [...rows].sort(bySeeders) }];
        const bySource = new Map();
        for (const r of rows) {
          const key = r.source || "unknown";
          if (!bySource.has(key)) bySource.set(key, []);
          bySource.get(key).push(r);
        }
        const sources = [...bySource.keys()].sort((a, b) => sourceRank(a) - sourceRank(b) || a.localeCompare(b));
        for (const s of sources) sections.push({ label: s, rows: bySource.get(s).sort(bySeeders) });
        return sections.filter((section) => section.rows.length);
      }

      function tileActionsHtml(r) {
        const magnet = r.magnet_link || "";
        const magnetBtn = magnet ? `<a href="${escapeHtml(magnet)}" title="Open magnet link" aria-label="Open magnet link">🧲</a>` : `<span title="No magnet link available">🚫</span>`;
        const copy = magnet
          ? `<button data-copy="${escapeHtml(magnet)}" title="Copy magnet link" aria-label="Copy magnet link">📋</button>`
          : `<button title="No magnet link available" aria-label="No magnet link available" disabled>📋</button>`;
        return `${tgButtons(r)}${magnetBtn}${copy}`;
      }

      function tileRowHtml(r, chipsHtml) {
        return `<div class="tile-row">
                <div class="tile-main">
                  <span class="tile-name-row">${infoButtonHtml(r)}<span class="tile-name" title="${escapeHtml(r.filename)}">${escapeHtml(r.filename)}</span></span>
                  ${chipsHtml || ""}
                  <span class="tile-meta"><span class="m-se">▲${r.seeders}</span><span class="m-le">▼${r.leechers}</span><span>${escapeHtml(r.size)}</span><span>${escapeHtml(r.date)}</span></span>
                </div>
                <div class="tile-actions">${tileActionsHtml(r)}</div>
              </div>`;
      }

      function tileHtml(section, mobile) {
        const isTop = section.label.startsWith("🏆");
        const hue = !isTop ? hueFor(section.label) : null;
        const titleColor = hue === null ? "var(--accent)" : `hsl(${hue} var(--src-fg-s) var(--src-fg-l))`;
        const title = isTop ? escapeHtml(section.label) : sourceLinkHtml(section.label, "", 'class="tile-source-link"');
        const openClass = mobile && isTop ? " open" : "";
        const rowsHtml = section.rows.map((r) => tileRowHtml(r, "")).join("");
        return `<div class="tile${isTop ? " tile-top" : ""}${openClass}">
            <div class="tile-head" data-tile-head><span class="tile-title" style="color: ${titleColor}">${title}</span><span class="tile-count">${section.rows.length}</span><span class="tile-chevron">▼</span></div>
            <div class="tile-body">${rowsHtml}</div>
          </div>`;
      }

      const mobileQuery = window.matchMedia("(max-width: 640px)");

      function renderTiles() {
        $("tiles").classList.remove("tile-cards");
        $("tiles").innerHTML = buildSections()
          .map((section) => tileHtml(section, mobileQuery.matches))
          .join("");
      }

      // Mobile search view: the fixed-columns table cannot fit a phone, so
      // results render as the same card rows the popular tiles use.
      function renderCards() {
        $("tiles").classList.add("tile-cards");
        $("tiles").innerHTML = rows
          .map((r) => {
            const chips = sourceChipHtml(r) + categoryChipHtml(r);
            return tileRowHtml(r, chips ? `<span class="torrent-detail">${chips}</span>` : "");
          })
          .join("");
      }

      // Mobile accordion: the whole title bar toggles a tile; opening one
      // closes the others. Desktop tiles are always expanded.
      $("tiles").addEventListener("click", (e) => {
        const head = e.target.closest("[data-tile-head]");
        if (!head || e.target.closest("a")) return; // links navigate, never toggle
        if (!window.matchMedia("(max-width: 640px)").matches) return;
        const tile = head.closest(".tile");
        const wasOpen = tile.classList.contains("open");
        document.querySelectorAll("#tiles .tile.open").forEach((t) => t.classList.remove("open"));
        if (!wasOpen) tile.classList.add("open");
      });
      mobileQuery.addEventListener("change", () => {
        render();
      });

      function render() {
        if (!rows.length) {
          showEmpty();
          return;
        }
        showResults();
        const mobile = mobileQuery.matches;
        if (viewMode === "search") {
          if (mobile) {
            renderCards();
          } else {
            renderTable();
          }
        } else {
          renderTiles();
        }
      }

      async function fetchJson(url, options) {
        const res = await fetch(url, {
          cache: "no-store",
          ...options,
          headers: { ...authHeaders(), ...(options && options.headers) },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      let requestSeq = 0;
      async function run(url, options, activeBtn) {
        const seq = ++requestSeq;
        showLoading();
        $("btn-search").disabled = true;
        $("btn-popular").disabled = true;
        const icon = activeBtn.querySelector(".btn-icon");
        const originalIcon = icon ? icon.textContent : null;
        if (icon) icon.textContent = "⏳";
        try {
          const data = await fetchJson(url, options);
          if (seq !== requestSeq) return; // a newer request superseded this one
          rows = [...data].sort((a, b) => (b.seeders ?? 0) - (a.seeders ?? 0));
          render();
          if (!rows.length) showEmpty();
        } catch (err) {
          if (seq !== requestSeq) return;
          rows = [];
          showEmpty();
          toast(`Request failed: ${err.message}. Is the server running?`, "Torrent Search", {
            variant: "danger",
          });
        } finally {
          if (seq === requestSeq) {
            if (icon && originalIcon !== null) icon.textContent = originalIcon;
            $("btn-search").disabled = false;
            $("btn-popular").disabled = false;
          }
        }
      }

      function doSearch() {
        const q = $("query").value.trim();
        if (!q) {
          toast("Enter a query first", "Torrent Search", {
            variant: "warning",
          });
          return;
        }
        viewMode = "search";
        run(`/torrent/search?query=${encodeURIComponent(q)}&max_items=1000`, { method: "POST" }, $("btn-search"));
      }

      function doPopular() {
        viewMode = "sections";
        run(`/torrent/popular?per_source=1000`, {}, $("btn-popular"));
      }

      $("btn-search").onclick = doSearch;
      $("btn-popular").onclick = doPopular;
      $("query").addEventListener("keydown", (e) => {
        if (e.key === "Enter") doSearch();
      });

      // ---- Telegram session (lock button + gate) ------------------------------
      function showGate() {
        $("gate").hidden = false;
        $("app").hidden = true;
      }
      function showApp() {
        $("gate").hidden = true;
        $("app").hidden = false;
      }

      function paintLock() {
        const lock = $("auth-lock");
        lock.textContent = session.authenticated ? "🔓" : "🔒";
        lock.classList.toggle("authed", session.authenticated);
        lock.classList.toggle("locked", !session.authenticated);
        lock.title = session.authenticated ? `Telegram access granted (@${session.handle}) - click to log out` : "Telegram access: not authenticated - click to pair";
      }

      async function refreshSession() {
        try {
          const state = await fetchJson("/telegram/session");
          session.enabled = !!state.enabled;
          session.authenticated = !!state.authenticated;
          session.handle = state.handle || null;
          session.prune = !!state.prune_magnet_links;
          session.agent_name = state.agent_name || null;
        } catch {
          session.enabled = false;
          session.authenticated = true; // offline server: don't gate the UI
          session.handle = null;
        }
        paintLock();
        return session;
      }

      $("auth-lock").onclick = () => {
        if (!session.enabled) {
          toast("Telegram integration is disabled (TELEGRAM_BOT_HANDLE unset)", "Telegram", { variant: "warning" });
          return;
        }
        if (session.authenticated) {
          fetch("/telegram/auth/logout", {
            method: "POST",
            headers: authHeaders(),
          })
            .catch(() => {})
            .finally(() => {
              setToken("");
              session.authenticated = false;
              session.handle = null;
              paintLock();
              toast("Logged out - Telegram access revoked", "Telegram", {
                variant: "success",
              });
              showGate();
              openAuthDialog();
            });
        } else {
          openAuthDialog();
        }
      };

      // ---- Auth pairing dialog ------------------------------------------------
      const authDialog = $("auth-dialog");
      let authCode = null;
      let authMessage = "";
      let authPollTimer = null; // 2s approval poll
      let authCountdownTimer = null; // 1s ttl ticker
      let authSecondsLeft = 0;

      function stopAuthPolling() {
        if (authPollTimer) {
          clearInterval(authPollTimer);
          authPollTimer = null;
        }
        if (authCountdownTimer) {
          clearInterval(authCountdownTimer);
          authCountdownTimer = null;
        }
      }

      function setAuthStatus(text, cls) {
        const el = $("auth-status");
        el.textContent = text;
        el.classList.remove("ok", "bad");
        if (cls) el.classList.add(cls);
      }

      // Draw a QR for a deep link. The generator loads through indexed-cache
      // like the toast lib, so retry until it lands (capped).
      function drawQr(boxId, text, attempt) {
        if ((attempt || 0) > 20) return;
        if (!window.qrcode) {
          setTimeout(() => drawQr(boxId, text, (attempt || 0) + 1), 500);
          return;
        }
        try {
          const qr = window.qrcode(0, "L");
          qr.addData(text);
          qr.make();
          $(boxId).innerHTML = qr.createSvgTag({
            cellSize: 4,
            margin: 0,
            scalable: true,
          });
        } catch {
          $(boxId).innerHTML = ""; // QR failed; the buttons remain usable
        }
      }

      function renderAuthWaiting() {
        const mm = String(Math.floor(authSecondsLeft / 60)).padStart(2, "0");
        const ss = String(authSecondsLeft % 60).padStart(2, "0");
        setAuthStatus(`Waiting for approval... ${mm}:${ss}`, "waiting");
      }

      async function createChallenge() {
        stopAuthPolling();
        setAuthStatus("Generating pairing code...");
        try {
          const data = await fetchJson("/telegram/auth/challenge", {
            method: "POST",
          });
          authCode = data.code;
          // Exact message the bot expects from the user's chat.
          authMessage = `Authorize ${data.code} for Torrent Search`;
          // Copy affordance rides the shared data-copy dispatcher.
          const copyBtn = $("auth-copy-msg");
          copyBtn.dataset.copy = authMessage;
          copyBtn.dataset.toastLabel = "Login message copied - paste it in your Telegram chat with the bot";
          // Deep link into the bot with the authorization message prefilled -
          // the user just has to send it. The QR encodes the same link.
          const links = {
            app: `tg://resolve?domain=${encodeURIComponent(session.handle)}&text=${encodeURIComponent(authMessage)}`,
            web: `https://t.me/${encodeURIComponent(session.handle)}?text=${encodeURIComponent(authMessage)}`,
          };
          $("auth-open").dataset.app = links.app;
          $("auth-web-btn").dataset.web = links.web;
          drawQr("auth-qr", links.app);
          // 10-minute countdown; on expiry the challenge resets itself.
          authSecondsLeft = Math.max(1, Math.round(data.expires_in || 600));
          renderAuthWaiting();
          authCountdownTimer = setInterval(() => {
            authSecondsLeft -= 1;
            if (authSecondsLeft <= 0) {
              createChallenge();
              return;
            }
            renderAuthWaiting();
          }, 1000);
          authPollTimer = setInterval(pollChallenge, 2000);
        } catch (err) {
          authCode = null;
          $("auth-qr").innerHTML = "";
          setAuthStatus(`Could not create pairing code: ${err.message} - retrying...`, "bad");
          setTimeout(createChallenge, 15000);
        }
      }

      async function pollChallenge() {
        if (!authCode) return;
        try {
          const res = await fetch(`/telegram/auth/poll?code=${encodeURIComponent(authCode)}`, { cache: "no-store" });
          const data = await res.json();
          if (data.status === "approved" && data.token) {
            stopAuthPolling();
            authCode = null;
            setToken(data.token);
            setAuthStatus("✅ Access granted - this browser is paired.", "ok");
            await refreshSession();
            setTimeout(() => {
              showApp();
              if (authDialog.open) authDialog.close();
              doPopular();
            }, 900);
          } else if (data.status !== "pending") {
            // Approved elsewhere or swept server-side: reset right away.
            createChallenge();
          }
        } catch {
          /* transient network error: keep polling */
        }
      }

      function openAuthDialog() {
        authDialog.showModal();
        createChallenge();
      }

      // Authenticate or leave: the pairing popup cannot be dismissed. It
      // closes by itself once the code is approved. After any action the
      // countdown doubles as a fallback hint.
      $("auth-open").addEventListener("click", () => {
        location.href = $("auth-open").dataset.app;
      });
      $("auth-web-btn").addEventListener("click", () => {
        const url = $("auth-web-btn").dataset.web;
        if (url) window.open(url, "_blank", "noopener");
      });
      authDialog.addEventListener("cancel", (e) => e.preventDefault()); // block Escape
      authDialog.addEventListener("close", () => stopAuthPolling());

      // ---- Copy (single shared path for every copy affordance) ------------------
      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        // Fallback for plain-HTTP (non-secure) origins. Host the helper
        // textarea inside the active modal dialog if one is open: siblings of
        // a dialog[open] are inert, so body-level nodes cannot hold a
        // selection there and execCommand('copy') would silently no-op.
        const host = document.querySelector("dialog[open]") || document.body;
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        host.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        if (!ok) throw new Error("copy command failed");
      }

      document.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-copy]");
        if (!btn || btn.disabled || !btn.dataset.copy) return;
        try {
          await copyText(btn.dataset.copy);
          toast(btn.dataset.toastLabel || "Magnet link copied", "📋", {
            variant: "success",
            duration: 2500,
          });
        } catch {
          toast(btn.dataset.toastError || "Copy failed", "📋", {
            variant: "error",
            duration: 2500,
          });
        }
      });

      // ---- Filename tooltip toggle (ⓘ) ----------------------------------------
      const filenameTooltip = $("filename-tooltip");

      function closeFilenameTooltip() {
        filenameTooltip.hidden = true;
        document.querySelectorAll("button[data-info].tooltip-open").forEach((openBtn) => {
          openBtn.classList.remove("tooltip-open");
          openBtn.setAttribute("aria-expanded", "false");
        });
      }

      function openFilenameTooltip(btn) {
        filenameTooltip.textContent = btn.dataset.filename;
        filenameTooltip.hidden = false;
        const buttonRect = btn.getBoundingClientRect();
        const tooltipRect = filenameTooltip.getBoundingClientRect();
        const gap = 8;
        const margin = 8;
        let left = buttonRect.right + gap;
        if (left + tooltipRect.width > window.innerWidth - margin) left = buttonRect.left - tooltipRect.width - gap;
        left = Math.max(margin, Math.min(left, window.innerWidth - tooltipRect.width - margin));
        const top = Math.max(margin, Math.min(buttonRect.top + (buttonRect.height - tooltipRect.height) / 2, window.innerHeight - tooltipRect.height - margin));
        filenameTooltip.style.left = `${left}px`;
        filenameTooltip.style.top = `${top}px`;
        btn.classList.add("tooltip-open");
        btn.setAttribute("aria-expanded", "true");
      }

      document.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-info]");
        if (!btn) {
          closeFilenameTooltip();
          return;
        }
        const shouldOpen = !btn.classList.contains("tooltip-open");
        closeFilenameTooltip();
        if (shouldOpen) openFilenameTooltip(btn);
      });
      document.querySelector(".results-scroll").addEventListener("scroll", closeFilenameTooltip);
      window.addEventListener("resize", closeFilenameTooltip);

      // ---- Forward-to-Telegram popup -------------------------------------------
      // Same layout as the pairing popup: title (dismissible here), QR, - OR -,
      // three actions, centered status. PRUNE_MAGNET_LINKS=true prunes the
      // draft magnet here AND in /forward_telegram (every Telegram path);
      // copy/magnet buttons always keep the full original magnet.
      const tgDialog = $("tg-dialog");
      let tgTimer = null;
      let tgMessage = "";
      let tgPayload = null;
      function prunedMagnet(magnet) {
        const m = String(magnet || "");
        const xt = m.match(/[?&]xt=urn:btih:([^&]+)/i);
        if (!xt) return m;
        const dnMatch = m.match(/[?&]dn=([^&]*)/i);
        const dn = dnMatch ? decodeURIComponent(dnMatch[1]) : "";
        return `magnet:?xt=urn:btih:${xt[1]}${dn ? `&dn=${encodeURIComponent(dn)}` : ""}`;
      }
      function tgLinks(text) {
        return {
          app: `tg://resolve?domain=${encodeURIComponent(session.handle)}&text=${encodeURIComponent(text)}`,
          web: `https://t.me/${encodeURIComponent(session.handle)}?text=${encodeURIComponent(text)}`,
        };
      }

      function setTgStatus(text, cls) {
        const el = $("tg-status");
        el.textContent = text;
        el.classList.remove("ok", "bad", "waiting");
        if (cls) el.classList.add(cls);
      }

      function openTgDialog(ds) {
        const raw = ds.magnet || "";
        const magnet = session.prune ? prunedMagnet(raw) : raw;
        tgMessage = `Download this torrent: ${magnet}`;
        const agentMode = !!session.agent_name;
        $("tg-classic").hidden = agentMode;
        $("tg-agent").hidden = !agentMode;
        $("tg-status").textContent = "";
        if (agentMode) {
          // Agent relay: show the card, confirm posts /forward_telegram.
          $("tg-agent-lead").textContent = `Forward this torrent to ${session.agent_name}`;
          const rows = [
            { label: "File", value: ds.filename || "", cls: "wrap" },
            { label: "Source", value: sourceChipHtml(ds), raw: true },
            { label: "Category", value: categoryChipHtml(ds), raw: true },
            { label: "Date", value: ds.date || "" },
            { label: "Size", value: ds.size || "" },
            { label: "Seeders", value: ds.seeders ?? "", cls: "se" },
            { label: "Leechers", value: ds.leechers ?? "", cls: "le" },
          ].filter((row) => String(row.value).trim() !== "");
          $("tg-agent-card").innerHTML = `<dl>${rows
            .map((row) => `<dt>${row.label}</dt><dd${row.cls ? ` class="${row.cls}"` : ""}>${row.raw ? row.value : escapeHtml(row.value)}</dd>`)
            .join("")}</dl>`;
          tgPayload = {
            filename: ds.filename || "",
            magnet_link: raw,
            size: ds.size || null,
            seeders: ds.seeders !== "" && ds.seeders !== undefined ? Number(ds.seeders) : null,
          };
        } else {
          const copyBtn = $("tg-copy-msg");
          copyBtn.dataset.copy = tgMessage;
          copyBtn.dataset.toastLabel = "Download message copied - paste it in your Telegram chat with the bot";
          const links = tgLinks(tgMessage);
          $("tg-open").dataset.app = links.app;
          $("tg-web-btn").dataset.web = links.web;
          drawQr("tg-qr", links.app);
        }
        tgDialog.showModal();
      }

      document.addEventListener("click", (e) => {
        const a = e.target.closest("a[data-tg]");
        if (!a) return;
        e.preventDefault();
        if (!session.authenticated || !session.handle) {
          toast("Telegram is not paired on this browser", "Telegram", {
            variant: "warning",
          });
          return;
        }
        openTgDialog(a.dataset);
      });
      $("tg-confirm").addEventListener("click", async () => {
        const btn = $("tg-confirm");
        if (!tgPayload || btn.disabled) return;
        btn.disabled = true;
        try {
          await fetchJson("/forward_telegram", {
            method: "POST",
            body: JSON.stringify(tgPayload),
            headers: { "Content-Type": "application/json" },
          });
          setTgStatus("✅ Sent - check your chat with the agent.", "ok");
          tgTimer = setTimeout(() => {
            if (tgDialog.open) tgDialog.close();
          }, 1200);
        } catch (err) {
          setTgStatus(`Forward failed: ${err.message}`, "bad");
        } finally {
          btn.disabled = false;
        }
      });
      $("tg-cancel").addEventListener("click", () => tgDialog.close());
      $("tg-open").addEventListener("click", () => {
        location.href = $("tg-open").dataset.app;
        clearTimeout(tgTimer);
        tgTimer = setTimeout(() => {
          setTgStatus("Telegram didn't open? The app may not be installed - use t.me or Copy Message instead.", "waiting");
        }, 2000);
      });
      $("tg-web-btn").addEventListener("click", () => {
        const url = $("tg-web-btn").dataset.web;
        if (url) window.open(url, "_blank", "noopener");
      });
      tgDialog.addEventListener("click", (e) => {
        if (e.target === tgDialog) tgDialog.close();
      });
      tgDialog.addEventListener("close", () => clearTimeout(tgTimer));
      $("tg-close").addEventListener("click", () => tgDialog.close());

      // ---- Boot ----------------------------------------------------------------
      (async () => {
        const state = await refreshSession();
        if (!state.enabled) {
          // Telegram integration off: no gate, no telegram features.
          showApp();
          doPopular();
          return;
        }
        if (state.authenticated && getToken()) {
          showApp();
          doPopular();
          return;
        }
        // No valid token: gateway block - stars + pairing popup.
        setToken("");
        showGate();
        openAuthDialog();
      })();

      // ---- Orbit spinner (rAF) ------------------------------------------------
      // The spin3D keyframes are invalid (rotate3d(0deg)), so the template
      // really interpolates: colored orbits spin -360deg about (0.5,0.5,0.5),
      // white orbits slerp identity -> 90deg about their own axes. Driven with
      // one rAF loop; no CSS animations involved.
      const orbitConfigs = [
        [".blue-orbit", [0.5, 0.5, 0.5], -360, 3, 0.2],
        [".green-orbit", [0.5, 0.5, 0.5], -360, 2, 0],
        [".red-orbit", [0.5, 0.5, 0.5], -360, 1, 0],
        [".w1", [1, 1, 1], 90, 10, 0],
        [".w2", [1, 2, 0.5], 90, 10, 0],
        [".w3", [0.5, 1, 2], 90, 10, 0],
      ].map(([sel, [x, y, z], sweep, dur, delay]) => ({
        el: document.querySelector(sel),
        x,
        y,
        z,
        sweep,
        dur,
        delay,
      }));
      function orbitFrame(now) {
        const t = now / 1000;
        for (const o of orbitConfigs) {
          const p = (Math.max(t - o.delay, 0) / o.dur) % 1;
          o.el.style.transform = `rotate3d(${o.x},${o.y},${o.z},${(o.sweep < 0 ? -o.sweep : 0) + o.sweep * p}deg)`;
        }
        requestAnimationFrame(orbitFrame);
      }
      requestAnimationFrame(orbitFrame);
    </script>
  </body>
</html>
